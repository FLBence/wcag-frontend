<div class="max-w-xl mx-auto p-6 bg-white rounded-xl shadow-md border border-gray-100 mb-8">
  <h2 class="text-xl font-bold text-gray-800 mb-4">
    WCAG Ellenőrzés Indítása
  </h2>

  <form (submit)="$event.preventDefault(); onStartScan()" class="flex flex-col gap-4">
    <div>
      <label for="websiteUrl" class="block text-sm font-semibold text-gray-800 mb-1">
          Adja meg az ellerőrizni kívánt weboldal URL címét:
      </label>
      <input
        type="url"
        id="websiteUrl"
        name="websiteUrl"
        [(ngModel)]="websiteUrl"
        [disabled]="isLoading"
        placeholder="https://example.com"
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition disabled:bg-gray-100 disabled:cursor-not-allowed text-gray-800 placeholder-gray-400"
      />
    </div>

    <button
      type="submit"
      [disabled]="isLoading || !websiteUrl.trim()"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-sm"
    >
    @if (isLoading) {
      <span 
        class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"
        aria-hidden="true"
      > </span>
    } @else {
      <span>
        Ellenőrzés
      </span>
    }
    </button>

  @if (errorMessage) {
  <div class="mb-4 flex items-center justify-between rounded-lg border border-red-300 bg-red-100 p-4 text-sm text-red-700" role="alert">
    <div>
      <span class="font-bold">Hiba:</span> {{ errorMessage }}
    </div>
    <button (click)="errorMessage = ''" type="button" class="ml-auto pl-4 font-bold text-red-700 hover:text-red-900 focus:outline-none">
      X
    </button>
  </div>
}
  </form>
</div>
