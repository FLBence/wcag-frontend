<div
  class="max-w-xl mx-auto p-6 bg-white dark:bg-gray-800 rounded-xl shadow-md border border-gray-100 dark:border-gray-700 mb-8 transition-colors"
>
  <h2 class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-4">WCAG Ellenőrzés Indítása</h2>

  <form (submit)="onStartScan()" class="flex flex-col gap-4">
    <div>
      <label
        for="websiteUrl"
        class="block text-sm font-semibold text-gray-800 dark:text-gray-200 mb-1"
      >
        Adja meg az ellerőrizni kívánt weboldal URL címét:
      </label>
      <input
        type="url"
        id="websiteUrl"
        name="websiteUrl"
        [(ngModel)]="websiteUrl"
        [disabled]="isLoading"
        placeholder="https://example.com"
        class="w-full px-4 py-2.5 border border-gray-300 dark:border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition disabled:bg-gray-100 dark:disabled:bg-gray-900/50 disabled:cursor-not-allowed text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 bg-white dark:bg-gray-900"
      />
    </div>

    <button
      type="submit"
      [disabled]="isLoading || !websiteUrl.trim()"
      class="w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-sm"
    >
      @if (isLoading) {
        <span
          class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"
          aria-hidden="true"
        >
        </span>
      } @else {
        <span> Ellenőrzés </span>
      }
    </button>

    @if (errorMessage) {
      <div
        class="mb-4 flex items-center justify-between rounded-lg border border-red-300 dark:border-red-900 bg-red-100 dark:bg-red-950/60 p-4 text-sm text-red-700 dark:text-red-300"
        role="alert"
      >
        <div><span class="font-bold">Hiba:</span> {{ errorMessage }}</div>
        <button
          (click)="errorMessage = ''"
          type="button"
          class="ml-auto pl-4 font-bold text-red-700 hover:text-red-900 dark:text-red-300 dark:hover:text-red-100 focus:outline-none"
        >
          X
        </button>
      </div>
    }
  </form>
</div>

@if (isAuthWindowOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm transition-opacity"
  >
    <div
      class="bg-white dark:bg-gray-900 p-6 rounded-2xl shadow-2xl max-w-md w-full mx-4 border border-gray-200 dark:border-gray-700"
    >
      <h3 class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-2">
        Bejelentkezés szükséges
      </h3>
      <p class="text-gray-600 dark:text-gray-400 text-sm mb-6">
        A WCAG ellenőrzés elindításához és az eredmények mentéséhez be kell jelentkezned a fiókodba.
      </p>

      <div class="flex flex-col gap-3">
        <button
          (click)="redirectToLogin()"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition"
          title="Bejelentkezés"
        >
          Bejelentkezés
        </button>
        <button
          (click)="redirectToRegister()"
          class="w-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 font-semibold py-2.5 rounded-lg transition"
          title="Regisztráció"
        >
          Még nincs fiókom (Regisztráció)
        </button>
        <button
          (click)="isAuthWindowOpen.set(false)"
          class="mt-2 text-sm text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 text-center"
        >
          Mégse
        </button>
      </div>
    </div>
  </div>
}
